#tc{position:fixed;bottom:18px;left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 18px;z-index:600;pointer-events:none;}
.tb{pointer-events:all;width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;}
.tb.pr{background:rgba(255,255,255,.35);}
#pub{pointer-events:all;width:70px;height:70px;border-radius:50%;border:3px solid #ff00ff;background:rgba(255,0,255,.25);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;}
#sl{position:fixed;inset:0;pointer-events:none;z-index:400;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,200,255,.08) 100%);opacity:0;transition:opacity .2s;}
#msg{position:fixed;top:22%;left:50%;transform:translateX(-50%);font-size:clamp(20px,5vw,38px);color:#ffff00;text-shadow:0 0 20px #ff8800;pointer-events:none;z-index:700;opacity:0;transition:opacity .3s;white-space:nowrap;}
</style>

<body>
<div id="loading"><h1>WILD RIDE</h1><div id="loadBar"><div id="loadFill"></div></div><div id="loadText">INITIALIZING...</div></div>
<div id="menu"><h1>WILD RIDE</h1><div class="sub">THE MOST INSANE RACE ON EARTH</div><button class="btn" id="startBtn">START RACE</button><button id="gyroBtn">🎮 ENABLE GYROSCOPE</button></div>
<div id="hud"><div id="spd">0<span>KM/H</span></div><div id="pos">1<span>PLACE</span></div><div id="lap">LAP 1/3</div></div>
<div id="puhud"></div>
<div id="cd"><div id="cdt">3</div></div>
<div id="end"><h2 id="endTitle">RACE COMPLETE!</h2><div id="endStats"></div><button class="btn" onclick="location.reload()">RACE AGAIN</button></div>
<div id="tc"><div class="tb" id="lb">◀</div><div id="pub">⚡</div><div class="tb" id="rb">▶</div></div>
<div id="sl"></div><div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ── CONFIG ───────────────────────────────────────────────────────────────────
const SEGS   = 200;   // road resolution — lower = faster
const ROAD_W = 16;
const CAR_H  = 1.8;
const LAPS   = 3;
const MAX_PAR = 120;  // particle pool size

// ── STATE ────────────────────────────────────────────────────────────────────
let renderer, scene, camera, clock;
let curve, roadBi = [];     // precomputed flat binormals
let playerCar, aiCars = [];
let powerups = [], projectiles = [];
let parPool = [], parActive = [];   // particle pool
let gameState = 'loading';
let keys = {}, tilt = 0, gyroEnabled = false;
let touchLeft = false, touchRight = false;
let raceStart = 0, lapTimes = [], currentLap = 1;
let playerPU = null, shieldOn = false, magnetOn = false, magnetT = 0;
let msgTO, engineSfx = null, audioCtx;
let stars, respawnT = 0, shieldMesh = null;
const camPos  = new THREE.Vector3();
const camLook = new THREE.Vector3();
const _va = new THREE.Vector3(), _vb = new THREE.Vector3();
const UP = new THREE.Vector3(0,1,0);
const W = () => window.innerWidth, H = () => window.innerHeight;
const $ = id => document.getElementById(id);

// ── SHARED GEOMETRIES & MATERIALS ─────────────────────────────────────────────
// Defined once, reused — avoids per-car allocation overhead
const GEO = {
  carBody : new THREE.BoxGeometry(2.8, 0.58, 5.0),
  carTop  : new THREE.BoxGeometry(2.2, 0.62, 2.1),
  wing    : new THREE.BoxGeometry(3.1, 0.1,  0.65),
  tyre    : new THREE.CylinderGeometry(0.56, 0.56, 0.4, 14),
  rim     : new THREE.CylinderGeometry(0.34, 0.34, 0.42, 8),
  post    : new THREE.CylinderGeometry(0.18, 0.18, 2.4, 6),
  parSph  : new THREE.SphereGeometry(0.28, 3, 3),
  puOuter : new THREE.TorusGeometry(1.0, 0.22, 7, 20),
  puInner : new THREE.SphereGeometry(0.5, 8, 8),
};
const MAT = {
  road    : new THREE.MeshStandardMaterial({color:0x181830,roughness:.4,metalness:.5,emissive:0x060622}),
  darkGlass:new THREE.MeshStandardMaterial({color:0x0a1520,metalness:.9,roughness:.05,transparent:true,opacity:.65}),
  tyre    : new THREE.MeshStandardMaterial({color:0x111111,roughness:.95,metalness:.1}),
  rim     : new THREE.MeshStandardMaterial({color:0xdddddd,metalness:1,roughness:.05}),
  white   : new THREE.MeshBasicMaterial({color:0xffffff}),
  parMats : {},  // keyed by hex color, MeshBasicMaterial
};
function parMat(col) {
  if (!MAT.parMats[col]) MAT.parMats[col] = new THREE.MeshBasicMaterial({color:col,transparent:true});
  return MAT.parMats[col];
}
function carMat(col, emI=0.18) {
  return new THREE.MeshStandardMaterial({color:col,metalness:.9,roughness:.12,emissive:col,emissiveIntensity:emI});
}

// ── LOAD ─────────────────────────────────────────────────────────────────────
function setLoad(p,t){$('loadFill').style.width=p+'%';$('loadText').textContent=t;}
function wait(ms=55){return new Promise(r=>setTimeout(r,ms));}

async function init(){
  setLoad(8,'BUILDING RENDERER...');  setupRenderer();
  setLoad(20,'GENERATING TRACK...');  await wait(); buildTrack();
  setLoad(42,'PARTICLE POOL...');     await wait(); buildParticlePool();
  setLoad(54,'SPAWNING CARS...');     await wait(); buildCars();
  setLoad(68,'POWER-UPS...');         await wait(); spawnPUs();
  setLoad(80,'ATMOSPHERE...');        await wait(); buildEnv();
  setLoad(94,'READY...');             await wait(); setupControls();
  setLoad(100,'GO!');                 await wait(380);
  $('loading').style.display='none';
  $('menu').style.display='flex';
  gameState='menu';
  renderer.setAnimationLoop(loop);
}

// ── RENDERER ─────────────────────────────────────────────────────────────────
function setupRenderer(){
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // cap pixel ratio
  renderer.setSize(W(),H());
  renderer.shadowMap.enabled = false;  // OFF — big perf win
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  scene  = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000816, 0.004);
  camera = new THREE.PerspectiveCamera(62, W()/H(), 0.1, 1500);
  camera.up.copy(UP);
  clock  = new THREE.Clock();
  window.addEventListener('resize',()=>{
    renderer.setSize(W(),H()); camera.aspect=W()/H(); camera.updateProjectionMatrix();
  });
}

// ── PARTICLE POOL ─────────────────────────────────────────────────────────────
// Pre-allocate MAX_PAR meshes — no GC pressure during gameplay
function buildParticlePool(){
  for(let i=0;i<MAX_PAR;i++){
    const m = new THREE.Mesh(GEO.parSph, MAT.white.clone());
    m.visible = false;
    m.userData = {active:false, vx:0,vy:0,vz:0, life:0, max:1, col:0xffffff};
    scene.add(m);
    parPool.push(m);
  }
}

function spawnPar(x,y,z, vx,vy,vz, life, col){
  let m = parPool.find(p=>!p.userData.active);
  if(!m) return;
  m.visible = true;
  m.position.set(x,y,z);
  m.material.color.setHex(col);
  m.material.opacity = 1;
  const d = m.userData;
  d.active=true; d.vx=vx;d.vy=vy;d.vz=vz; d.life=life; d.max=life; d.col=col;
  parActive.push(m);
}

function updatePar(dt){
  for(let i=parActive.length-1;i>=0;i--){
    const m=parActive[i], d=m.userData;
    d.life -= dt;
    if(d.life <= 0){ m.visible=false; d.active=false; parActive.splice(i,1); continue; }
    d.vy -= 14*dt;
    m.position.x+=d.vx*dt; m.position.y+=d.vy*dt; m.position.z+=d.vz*dt;
    m.material.opacity = d.life/d.max;
  }
}

// ── TRACK ────────────────────────────────────────────────────────────────────
function buildTrack(){
  const cp = genCP();
  curve = new THREE.CatmullRomCurve3(cp, true, 'catmullrom', 0.5);

  // Flat binormals — cross(tangent, worldUp) — road always faces up
  roadBi = [];
  for(let i=0;i<=SEGS;i++){
    const tan = curve.getTangent(i/SEGS).normalize();
    roadBi.push(new THREE.Vector3().crossVectors(tan, UP).normalize());
  }
  buildRoadMesh();
  buildRails();
  buildMarks();
  buildTrackLights();
}

function genCP(){
  // Gently curving circuit with hills max ±14 units
  const yPts=[0,5,10,13,9,5,1,0,-3,0,4,8,12,8,4,1,-2,0,3,7,11,7,3,0,-3,0,2,0];
  return yPts.map((y,i)=>{
    const t=i/yPts.length, a=t*Math.PI*2;
    const rx=100+Math.sin(t*Math.PI*3)*42;
    const rz=82 +Math.cos(t*Math.PI*2)*32;
    return new THREE.Vector3(Math.cos(a)*rx, y, Math.sin(a)*rz);
  });
}

function getRoadBi(t){ return roadBi[Math.min(Math.floor(((t%1)+1)%1*SEGS),SEGS-1)]; }

function buildRoadMesh(){
  const pos=[], idx=[], uv=[];
  for(let i=0;i<=SEGS;i++){
    const t=i/SEGS, p=curve.getPoint(t), b=roadBi[i];
    const L=p.clone().addScaledVector(b,-ROAD_W), R=p.clone().addScaledVector(b,ROAD_W);
    pos.push(L.x,L.y,L.z, R.x,R.y,R.z);
    uv.push(0,t*50, 1,t*50);
  }
  for(let i=0;i<SEGS;i++){
    const a=i*2,b=i*2+1,c=a+2,d=b+2; idx.push(a,b,c,b,d,c);
  }
  idx.push(SEGS*2,SEGS*2+1,0,SEGS*2+1,1,0);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  geo.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(uv),2));
  geo.setIndex(idx); geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, MAT.road));
}

function buildRails(){
  const COLS=[0xff00ff, 0x00ffff];
  [-ROAD_W, ROAD_W].forEach((side,si)=>{
    const topPts=[];
    for(let i=0;i<=SEGS;i++){
      const p=curve.getPoint(i/SEGS), b=roadBi[i];
      topPts.push(p.clone().addScaledVector(b,side).add(new THREE.Vector3(0,2.4,0)));
    }
    // neon top rail line
    scene.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(topPts),
      new THREE.LineBasicMaterial({color:COLS[si]})
    ));
    // glowing posts every 12 segs (not every 10 — fewer objects)
    for(let i=0;i<SEGS;i+=12){
      const p=curve.getPoint(i/SEGS), b=roadBi[i];
      const base=p.clone().addScaledVector(b,side).add(new THREE.Vector3(0,1.2,0));
      const post=new THREE.Mesh(GEO.post,
        new THREE.MeshStandardMaterial({color:COLS[si],emissive:COLS[si],emissiveIntensity:2}));
      post.position.copy(base); scene.add(post);
    }
  });
}

function buildMarks(){
  const cPts=[], lPts=[], rPts=[];
  for(let i=0;i<=SEGS;i++){
    const t=i/SEGS, p=curve.getPoint(t).clone().add(new THREE.Vector3(0,.06,0));
    const b=roadBi[i];
    if(Math.floor(i/6)%2===0) cPts.push(p);
    if(Math.floor(i/4)%2===0){
      lPts.push(p.clone().addScaledVector(b,-ROAD_W+1.8));
      rPts.push(p.clone().addScaledVector(b, ROAD_W-1.8));
    }
  }
  const lm = new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.25});
  const ym = new THREE.LineBasicMaterial({color:0xffff00,transparent:true,opacity:.45});
  if(cPts.length) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(cPts),lm));
  if(lPts.length) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(lPts),ym));
  if(rPts.length) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rPts),ym));
}

function buildTrackLights(){
  // Only 10 track lights total — each PointLight is expensive
  for(let i=0;i<10;i++){
    const p=curve.getPoint(i/10);
    const col=[0xff00ff,0x00ffff,0x6600ff,0x00ff88,0xffaa00][i%5];
    const l=new THREE.PointLight(col,4,160); l.position.copy(p).y+=8; scene.add(l);
  }
}

// ── CAR PLACEMENT ────────────────────────────────────────────────────────────
// Use lookAt toward a point BEHIND on the track — avoids manual matrix math
// and handles degenerate (nearly-vertical) tangents gracefully.
// Car mesh has front at +Z, so looking at the point behind makes +Z face forward.
function placeOnTrack(car,t,lat){
  const norm = ((t%1)+1)%1;
  const p    = curve.getPoint(norm);
  const bi   = getRoadBi(t);

  car.position.copy(p)
    .addScaledVector(bi, lat*ROAD_W*.7)
    .add(new THREE.Vector3(0, CAR_H, 0));

  // Point slightly behind on track for lookAt target
  const tBack = ((norm - 0.008 + 1) % 1);
  const behind = curve.getPoint(tBack)
    .addScaledVector(getRoadBi(tBack), lat*ROAD_W*.7)
    .add(new THREE.Vector3(0, CAR_H, 0));

  car.up.set(0,1,0);
  car.lookAt(behind);

  // Gentle lean into turns
  car.rotateZ(lat * 0.10);
}

// ── CARS ─────────────────────────────────────────────────────────────────────
function buildCars(){
  playerCar = makeCar(0xff0066,0x00ffff);
  playerCar.userData = mkD(0,true);
  scene.add(playerCar);

  [[0xff5500,0xffcc00],[0x00bb44,0x0099ff],[0xaa00ff,0xff66ff]].forEach((c,i)=>{
    const car=makeCar(c[0],c[1]);
    car.userData=mkD(0.025+i*.025,false);
    car.userData.baseSpeed=0.00068+Math.random()*.00022;
    car.userData.maxSpeed =0.0018 +Math.random()*.0003;
    car.userData.aggression=0.3+Math.random()*.5;
    scene.add(car); aiCars.push(car);
  });
}

function mkD(t,isPlayer){
  return{t,speed:0,baseSpeed:.00075,maxSpeed:.002,lat:0,lap:1,lapCount:0,boost:0,frozen:0,isPlayer,falling:false,fallVel:new THREE.Vector3()};
}

function makeCar(bodyCol,accentCol){
  const g = new THREE.Group();
  const bm = carMat(bodyCol);
  const am = carMat(accentCol, 1.5);

  // Body
  const body=new THREE.Mesh(GEO.carBody,bm); body.position.y=.29; g.add(body);

  // Cabin (cockpit)
  const top=new THREE.Mesh(GEO.carTop,carMat(bodyCol,.1)); top.position.set(0,.88,-.22); g.add(top);

  // Windscreen
  const wind=new THREE.Mesh(new THREE.BoxGeometry(2.0,.48,.1),MAT.darkGlass);
  wind.position.set(0,.91,.75); wind.rotation.x=-.3; g.add(wind);

  // Rear wing
  const wing=new THREE.Mesh(GEO.wing,am); wing.position.set(0,1.08,-2.18); g.add(wing);
  [-1.2,1.2].forEach(x=>{
    const s=new THREE.Mesh(new THREE.BoxGeometry(.1,.46,.1),am); s.position.set(x,.84,-2.18); g.add(s);
  });

  // Side skirts
  [-1.44,1.44].forEach(x=>{
    const sk=new THREE.Mesh(new THREE.BoxGeometry(.1,.18,4.8),am); sk.position.set(x,.1,0); g.add(sk);
  });

  // Headlights strip
  const hlm=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:4});
  const hl=new THREE.Mesh(new THREE.BoxGeometry(2.4,.14,.08),hlm); hl.position.set(0,.38,2.55); g.add(hl);

  // Taillights strip
  const tl=new THREE.Mesh(new THREE.BoxGeometry(2.4,.12,.08),am); tl.position.set(0,.38,-2.55); g.add(tl);

  // 4 Wheels — reuse shared geometry
  const wPos=[[-1.52,-.12,1.6],[1.52,-.12,1.6],[-1.52,-.12,-1.6],[1.52,-.12,-1.6]];
  const wheels=[];
  wPos.forEach(([x,y,z])=>{
    const wg=new THREE.Group(); wg.position.set(x,y,z);
    const tyreM=new THREE.Mesh(GEO.tyre,MAT.tyre); tyreM.rotation.z=Math.PI/2; wg.add(tyreM);
    const rimM =new THREE.Mesh(GEO.rim, MAT.rim);  rimM.rotation.z=Math.PI/2;  wg.add(rimM);
    g.add(wg); wheels.push(wg);
  });
  g.userData.wheels=wheels;

  // Under-glow — ONE PointLight per car (not 4-5!)
  const ug=new THREE.PointLight(accentCol,2,14); ug.position.set(0,-.4,0); g.add(ug);

  g.userData.accentCol=accentCol;
  return g;
}

// ── POWERUPS ─────────────────────────────────────────────────────────────────
const PU=[
  {id:'turbo',    emoji:'💨',color:0x00ffff,name:'TURBO BOOST'},
  {id:'rocket',   emoji:'🔫',color:0xff4400,name:'ROCKET'},
  {id:'shield',   emoji:'🛡',color:0x4488ff,name:'SHIELD'},
  {id:'magnet',   emoji:'🧲',color:0xff8800,name:'MAGNET'},
  {id:'bomb',     emoji:'💣',color:0x888888,name:'BOMB'},
  {id:'ice',      emoji:'❄',color:0x88ddff,name:'ICE'},
  {id:'lightning',emoji:'⚡',color:0xffff00,name:'LIGHTNING'},
];

function spawnPUs(){
  for(let i=0;i<16;i++){
    const t=(i/16)+.04, tp=PU[i%PU.length];
    const bi=getRoadBi(t);
    const pos=curve.getPoint(((t%1)+1)%1).clone()
      .addScaledVector(bi,(i%3-1)*5)
      .add(new THREE.Vector3(0,3.2,0));
    const grp=new THREE.Group();
    grp.add(new THREE.Mesh(GEO.puOuter,
      new THREE.MeshStandardMaterial({color:tp.color,emissive:tp.color,emissiveIntensity:2})));
    grp.add(new THREE.Mesh(GEO.puInner,MAT.white));
    grp.add(new THREE.PointLight(tp.color,4,20));
    grp.position.copy(pos);
    grp.userData={t,type:tp,collected:false,bob:Math.random()*Math.PI*2};
    scene.add(grp); powerups.push(grp);
  }
}

// ── ENVIRONMENT ───────────────────────────────────────────────────────────────
function buildEnv(){
  // Stars
  const N=1800,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=500+Math.random()*300;
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
    const c=new THREE.Color().setHSL(Math.random(),.6,.7+Math.random()*.3);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  const sGeo=new THREE.BufferGeometry();
  sGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  sGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
  stars=new THREE.Points(sGeo,new THREE.PointsMaterial({size:1.4,vertexColors:true}));
  scene.add(stars);

  // City buildings — 18, simpler (1 mesh + 1 emissive top strip per building)
  const bMat=new THREE.MeshStandardMaterial({color:0x060620,roughness:1});
  const gCols=[0xff00ff,0x00ffff,0x8800ff,0x00ff88];
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2, r=235+Math.random()*90;
    const h=40+Math.random()*100, w=9+Math.random()*14;
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),bMat);
    b.position.set(Math.cos(a)*r,h/2-28,Math.sin(a)*r); scene.add(b);
    const gc=gCols[i%4];
    const top=new THREE.Mesh(new THREE.BoxGeometry(w+.3,1.5,w+.3),
      new THREE.MeshStandardMaterial({color:gc,emissive:gc,emissiveIntensity:2.5}));
    top.position.set(Math.cos(a)*r,h-28,Math.sin(a)*r); scene.add(top);
  }

  // Lights — scene-wide: 3 total directional/ambient (no per-building lights)
  scene.add(new THREE.AmbientLight(0x445577,1.8));  // strong ambient so cars always visible
  const sun=new THREE.DirectionalLight(0xaabbff,2.2);
  sun.position.set(60,200,80); scene.add(sun);
  const fill=new THREE.DirectionalLight(0xff00aa,.6);
  fill.position.set(-60,-30,-80); scene.add(fill);
  const fill2=new THREE.DirectionalLight(0x00aaff,.5);
  fill2.position.set(60,-30,80); scene.add(fill2);
}

// ── CONTROLS ─────────────────────────────────────────────────────────────────
function setupControls(){
  document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();usePU();}});
  document.addEventListener('keyup',e=>keys[e.code]=false);
  const on=(el,evts,fn)=>evts.forEach(ev=>el.addEventListener(ev,fn,{passive:false}));
  const L=$('lb'),R=$('rb'),P=$('pub');
  on(L,['touchstart','mousedown'],e=>{e.preventDefault();touchLeft=true;L.classList.add('pr');});
  on(R,['touchstart','mousedown'],e=>{e.preventDefault();touchRight=true;R.classList.add('pr');});
  on(P,['touchstart','mousedown'],e=>{e.preventDefault();usePU();});
  on(L,['touchend','mouseup','touchcancel'],e=>{e.preventDefault();touchLeft=false;L.classList.remove('pr');});
  on(R,['touchend','mouseup','touchcancel'],e=>{e.preventDefault();touchRight=false;R.classList.remove('pr');});
  $('gyroBtn').addEventListener('click',reqGyro);
  $('startBtn').addEventListener('click',startRace);
}
function reqGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')
    DeviceOrientationEvent.requestPermission().then(p=>{if(p==='granted')enableGyro();});
  else enableGyro();
}
function enableGyro(){
  gyroEnabled=true;
  window.addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=Math.max(-1,Math.min(1,e.gamma/28));});
  const b=$('gyroBtn'); b.textContent='✅ GYROSCOPE ACTIVE'; b.style.borderColor='#00ff88'; b.style.color='#00ff88';
}

// ── AUDIO ─────────────────────────────────────────────────────────────────────
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function tone(f,tp,dur,vol=.3,dly=0){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);o.type=tp;o.frequency.value=f;
  const t=audioCtx.currentTime+dly;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur);
}
const sfxBoost=()=>{ensureAudio();tone(220,'sawtooth',.3,.5);tone(440,'square',.2,.3,.1);};
const sfxGet  =()=>{ensureAudio();tone(880,'sine',.2,.4);tone(1200,'sine',.15,.3,.1);};
const sfxHit  =()=>{ensureAudio();tone(80,'sawtooth',.4,.6);};
const sfxBoom =()=>{ensureAudio();tone(60,'square',.5,.8);tone(120,'sawtooth',.3,.3,.1);};
const sfxCD   =n=>{ensureAudio();tone(n===0?880:440,'square',.3,.6);};

function startEngine(){
  if(engineSfx||!audioCtx)return;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.025;
  const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
  const f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=90;f.Q.value=2;
  const gn=audioCtx.createGain();gn.gain.value=.1;
  src.connect(f);f.connect(gn);gn.connect(audioCtx.destination);src.start();
  engineSfx={src,f,gn};
}

// ── RACE ──────────────────────────────────────────────────────────────────────
function startRace(){
  ensureAudio();
  $('menu').style.display='none'; $('hud').style.display='flex';
  $('puhud').style.display='block'; $('tc').style.display='flex';
  gameState='countdown';
  const pd=playerCar.userData;
  Object.assign(pd,{t:0,speed:0,lat:0,lap:1,lapCount:0,boost:0,frozen:0,falling:false});
  playerPU=null;shieldOn=false;magnetOn=false;currentLap=1;lapTimes=[];
  aiCars.forEach((c,i)=>{
    Object.assign(c.userData,{t:.024+i*.024,speed:0,lap:1,lapCount:0,boost:0,frozen:0,falling:false});
    c.userData.lat=(i%2===0?-.22:.22);
  });
  powerups.forEach(p=>{p.userData.collected=false;p.visible=true;});
  placeOnTrack(playerCar,0,0);
  aiCars.forEach((c,i)=>placeOnTrack(c,.024+i*.024,c.userData.lat));
  // Init camera
  const tan=curve.getTangent(0).normalize();
  camPos.copy(playerCar.position).addScaledVector(tan,-13).add(new THREE.Vector3(0,6,0));
  camLook.copy(playerCar.position).addScaledVector(tan,12);
  doCD();
}

function doCD(){
  const el=$('cdt'); let n=3;
  const step=()=>{
    el.style.opacity=1;el.style.transform='scale(1)';
    el.textContent=n===0?'GO!':String(n); el.style.color=n===0?'#00ff88':'#fff'; sfxCD(n);
    setTimeout(()=>{el.style.opacity=0;el.style.transform='scale(2)';},600);
    n--; if(n>=0)setTimeout(step,1000);
    else setTimeout(()=>{gameState='racing';raceStart=performance.now();startEngine();},1000);
  };
  step();
}

// ── UPDATE PLAYER ─────────────────────────────────────────────────────────────
function updatePlayer(dt){
  const d=playerCar.userData;
  if(d.falling){doFall(playerCar,dt);return;}
  let tgt=d.baseSpeed;
  if(d.boost >0){tgt=d.maxSpeed*1.6;d.boost-=dt;}
  else if(d.frozen>0){tgt=d.baseSpeed*.15;d.frozen-=dt;}
  else tgt=d.baseSpeed+(d.maxSpeed-d.baseSpeed)*.9;
  d.speed+=(tgt-d.speed)*Math.min(dt*7,1);
  d.t+=d.speed; if(d.t>=1){d.t-=1;finishLap(playerCar);}

  let steer=0;
  if(keys['ArrowLeft'] ||touchLeft )steer-=1;
  if(keys['ArrowRight']||touchRight)steer+=1;
  if(gyroEnabled)steer+=tilt;
  steer=Math.max(-1,Math.min(1,steer));
  d.lat+=steer*dt*2.0; d.lat*=(1-dt*.7); d.lat=Math.max(-1.3,Math.min(1.3,d.lat));
  if(Math.abs(d.lat)>=1.25){beginFall(playerCar);return;}
  placeOnTrack(playerCar,d.t,d.lat);
  spinWheels(playerCar,d.speed,dt);
  if(d.boost>0) emitBoost(playerCar);
  if(magnetOn){magnetT-=dt;if(magnetT<=0)magnetOn=false;else nearPU(playerCar,15);}
  aiCars.forEach(ai=>{if(playerCar.position.distanceTo(ai.position)<5.5)doRam(playerCar,ai);});
  powerups.forEach(pu=>{if(!pu.userData.collected&&playerCar.position.distanceTo(pu.position)<6.5)pickPU(playerCar,pu);});
  updateHUD(d);
}

function updateAI(car,dt){
  const d=car.userData;
  if(d.falling){doFall(car,dt);return;}
  let tgt=d.baseSpeed;
  if(d.boost >0){tgt=d.maxSpeed*1.4;d.boost-=dt;}
  else if(d.frozen>0){tgt=d.baseSpeed*.15;d.frozen-=dt;}
  else tgt=d.baseSpeed+(d.maxSpeed-d.baseSpeed)*.83;
  d.speed+=(tgt-d.speed)*Math.min(dt*4,1);
  d.t+=d.speed; if(d.t>=1){d.t-=1;d.lap++;d.lapCount++;}
  let steer=-d.lat*.88;
  const ah=((playerCar.userData.t-d.t+1)%1);
  if(ah<.04&&d.aggression>.4)steer+=(playerCar.userData.lat-d.lat)*d.aggression*1.6;
  d.lat+=steer*dt*1.8; d.lat=Math.max(-1.1,Math.min(1.1,d.lat));
  if(Math.abs(d.lat)>1.05&&Math.random()<.04)beginFall(car);
  placeOnTrack(car,d.t,d.lat);
  spinWheels(car,d.speed,dt);
  powerups.forEach(pu=>{
    if(!pu.userData.collected&&car.position.distanceTo(pu.position)<5.5){
      pu.userData.collected=true;pu.visible=false;if(Math.random()<.35)d.boost=2.5;
    }
  });
}

function spinWheels(car,speed,dt){
  car.userData.wheels?.forEach(wg=>wg.rotation.x+=speed*850*dt);
}

function beginFall(car){
  const d=car.userData;
  if(d.isPlayer&&shieldOn){shieldOn=false;d.lat=Math.sign(d.lat)*.5;showMsg('SHIELD SAVED YOU!');return;}
  d.falling=true; d.fallVel.set((Math.random()-.5)*7,12,(Math.random()-.5)*7);
  if(d.isPlayer){sfxHit();showMsg('FELL OFF!');respawnT=0;}
}

function doFall(car,dt){
  const d=car.userData;
  d.fallVel.y-=25*dt;
  car.position.addScaledVector(d.fallVel,dt);
  car.rotation.x+=dt*3; car.rotation.z+=dt*2;
  respawnT+=dt;
  const limit=d.isPlayer?2.5:1.8;
  if(respawnT>limit){
    d.falling=false;d.lat=0;car.rotation.set(0,0,0);placeOnTrack(car,d.t,0);
    if(d.isPlayer)showMsg('RESPAWNED!');
  }
}

function doRam(c1,c2){
  const diff=c1.userData.lat-c2.userData.lat;
  c1.userData.lat+=Math.sign(diff)*.22; c2.userData.lat-=Math.sign(diff)*.22;
  const mid=c1.position.clone().lerp(c2.position,.5);
  for(let i=0;i<6;i++)spawnPar(mid.x+(Math.random()-.5)*2,mid.y+(Math.random()-.5),(Math.random()-.5)*2,(Math.random()-.5)*14,Math.random()*9,(Math.random()-.5)*14,.4,0xffaa00);
  sfxHit();
}

function finishLap(car){
  const d=car.userData; d.lap++;d.lapCount++;
  if(d.isPlayer){
    currentLap=d.lap; lapTimes.push(performance.now()-raceStart);
    if(d.lap>LAPS){endRace();return;}
    $('lap').textContent=`LAP ${Math.min(d.lap,LAPS)}/${LAPS}`;
    showMsg(`LAP ${d.lap-1} COMPLETE!`);
  }
}

function endRace(){
  gameState='end';
  const ms=lapTimes[lapTimes.length-1]||(performance.now()-raceStart);
  const all=[playerCar,...aiCars].sort((a,b)=>(b.userData.lapCount+b.userData.t)-(a.userData.lapCount+a.userData.t));
  const p=all.indexOf(playerCar)+1;
  const sfx=['ST','ND','RD','TH'][Math.min(p-1,3)];
  $('endTitle').textContent=['🏆 CHAMPION!','🥈 GREAT RACE!','🥉 PODIUM!','😤 KEEP TRYING!'][p-1]||'😤 KEEP TRYING!';
  $('endStats').innerHTML=`<b>POSITION:</b> ${p}${sfx} PLACE<br><b>TIME:</b> ${(ms/1e3).toFixed(2)}s<br><b>LAPS:</b> ${LAPS}`;
  $('end').style.display='flex'; $('hud').style.display='none'; $('tc').style.display='none';
}

// ── POWERUPS ─────────────────────────────────────────────────────────────────
function pickPU(car,pu){
  pu.userData.collected=true;pu.visible=false;sfxGet();
  if(car.userData.isPlayer){
    playerPU=pu.userData.type;updatePUhud();showMsg(pu.userData.type.name+'!');
    setTimeout(()=>{if(pu.userData.collected){pu.userData.collected=false;pu.visible=true;}},9e3+Math.random()*4e3);
  }
}
function nearPU(car,r){powerups.forEach(pu=>{if(!pu.userData.collected&&car.position.distanceTo(pu.position)<r)pickPU(car,pu);});}

function usePU(){
  if(!playerPU||gameState!=='racing')return;
  ensureAudio();
  const tp=playerPU; playerPU=null; updatePUhud();
  const d=playerCar.userData;
  switch(tp.id){
    case 'turbo':    d.boost=3;sfxBoost();showMsg('TURBO!');break;
    case 'rocket':   fireRocket();break;
    case 'shield':   shieldOn=true;showMsg('SHIELD ON!');addShield(playerCar);setTimeout(()=>{shieldOn=false;remShield(playerCar);},8e3);break;
    case 'magnet':   magnetOn=true;magnetT=6;showMsg('MAGNET!');break;
    case 'bomb':     dropBomb();break;
    case 'ice':      freezeNear();break;
    case 'lightning':aiCars.forEach(ai=>ai.userData.frozen=2);showMsg('LIGHTNING!');break;
  }
}

function addShield(car){
  remShield(car);
  shieldMesh=new THREE.Mesh(new THREE.SphereGeometry(4.5,12,12),
    new THREE.MeshStandardMaterial({color:0x4488ff,emissive:0x4488ff,emissiveIntensity:.5,transparent:true,opacity:.28,wireframe:true}));
  car.add(shieldMesh);
}
function remShield(car){if(shieldMesh){car.remove(shieldMesh);shieldMesh=null;}}

function fireRocket(){
  let tgt=null,best=Infinity;
  const pt=playerCar.userData.t;
  aiCars.forEach(ai=>{const ah=((ai.userData.t-pt+1)%1);if(ah<.4&&ah<best){best=ah;tgt=ai;}});
  if(!tgt){showMsg('NO TARGET!');return;}
  const r=new THREE.Mesh(new THREE.ConeGeometry(.3,1.6,7),new THREE.MeshBasicMaterial({color:0xff4400}));
  r.add(new THREE.PointLight(0xff4400,4,14));
  r.position.copy(playerCar.position);
  r.userData={target:tgt,speed:55,rocket:true};
  scene.add(r);projectiles.push(r);sfxBoost();showMsg('ROCKET!');
}

function dropBomb(){
  const tan=curve.getTangent(((playerCar.userData.t%1)+1)%1).normalize();
  const b=new THREE.Mesh(new THREE.SphereGeometry(.6,7,7),new THREE.MeshBasicMaterial({color:0x888888}));
  b.add(new THREE.PointLight(0xffaa00,3,12));
  b.position.copy(playerCar.position).addScaledVector(tan,-3.5);
  b.userData={bomb:true,timer:2.5};
  scene.add(b);projectiles.push(b);showMsg('BOMB!');
}

function freezeNear(){
  let c=null,minD=Infinity;
  aiCars.forEach(ai=>{const d=playerCar.position.distanceTo(ai.position);if(d<minD){minD=d;c=ai;}});
  if(c){c.userData.frozen=2.5;emitIce(c.position);showMsg('FROZEN!');}
}

function updateProj(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    if(p.userData.rocket){
      const tgt=p.userData.target;
      if(tgt&&!tgt.userData.falling){
        _va.copy(tgt.position).sub(p.position).normalize();
        p.position.addScaledVector(_va,p.userData.speed*dt);p.lookAt(tgt.position);
        if(p.position.distanceTo(tgt.position)<5.5){emitBoom(p.position);beginFall(tgt);scene.remove(p);projectiles.splice(i,1);}
      }else{scene.remove(p);projectiles.splice(i,1);}
    }else if(p.userData.bomb){
      p.userData.timer-=dt;p.rotation.y+=dt*4;
      if(p.userData.timer<=0){
        emitBoom(p.position);
        aiCars.forEach(ai=>{if(ai.position.distanceTo(p.position)<13)beginFall(ai);});
        scene.remove(p);projectiles.splice(i,1);
      }
    }
  }
}

// ── PARTICLES (pool-based) ────────────────────────────────────────────────────
function emitBoost(car){
  const tan=curve.getTangent(((car.userData.t%1)+1)%1).normalize();
  const bi=getRoadBi(car.userData.t);
  const p=car.position;
  for(let i=0;i<3;i++){
    const ox=(Math.random()-.5); const oy=Math.random()*.3;
    spawnPar(p.x-tan.x*2.8+bi.x*ox, p.y-tan.y*2.8+oy, p.z-tan.z*2.8+bi.z*ox,
      -tan.x*(5+Math.random()*5)+bi.x*(Math.random()-.5),
       1+Math.random()*2,
      -tan.z*(5+Math.random()*5)+bi.z*(Math.random()-.5),
      .3+Math.random()*.2, 0x00eeff);
  }
}

function emitIce(pos){
  for(let i=0;i<8;i++)
    spawnPar(pos.x+(Math.random()-.5)*3,pos.y+(Math.random()-.5)*2,pos.z+(Math.random()-.5)*3,
      (Math.random()-.5)*8,Math.random()*6,(Math.random()-.5)*8,.6,0x88ddff);
}

function emitBoom(pos){
  sfxBoom();
  const cols=[0xff4400,0xff8800,0xffff00,0xff2200];
  for(let i=0;i<18;i++)
    spawnPar(pos.x,pos.y,pos.z,
      (Math.random()-.5)*22,Math.random()*16+5,(Math.random()-.5)*22,
      .7+Math.random()*.5, cols[i%4]);
}

// ── POWERUP ANIM ──────────────────────────────────────────────────────────────
function animPUs(dt,t){
  powerups.forEach(pu=>{
    if(pu.userData.collected)return;
    pu.rotation.y+=dt*2.4;
    pu.position.y+=Math.sin(t*2+pu.userData.bob)*dt*.7;
    if(pu.children[0])pu.children[0].material.emissiveIntensity=1.5+Math.sin(t*3+pu.userData.bob)*.8;
  });
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD(d){
  $('spd').innerHTML=`${Math.round(d.speed*265000)}<span>KM/H</span>`;
  const all=[playerCar,...aiCars].sort((a,b)=>(b.userData.lapCount+b.userData.t)-(a.userData.lapCount+a.userData.t));
  const p=all.indexOf(playerCar)+1;
  $('pos').innerHTML=`${p}<span>${['ST','ND','RD','TH'][Math.min(p-1,3)]} PLACE</span>`;
  $('lap').textContent=`LAP ${Math.min(d.lap,LAPS)}/${LAPS}`;
  const r=d.speed/d.maxSpeed;
  $('sl').style.opacity=d.boost>0?.9:Math.max(0,(r-.5)*2);
  if(engineSfx){engineSfx.f.frequency.value=70+r*240;engineSfx.gn.gain.value=.08+r*.14;}
}
function updatePUhud(){$('puhud').innerHTML=playerPU?`${playerPU.emoji}<span class="pn">${playerPU.name}</span>`:'';}
function showMsg(text){$('msg').textContent=text;$('msg').style.opacity=1;clearTimeout(msgTO);msgTO=setTimeout(()=>$('msg').style.opacity=0,1800);}

// ── CAMERA ────────────────────────────────────────────────────────────────────
function updateCam(dt){
  const d=playerCar.userData;
  _va.copy(curve.getTangent(((d.t%1)+1)%1).normalize());
  _va.y*=.2; _va.normalize(); // flatten tangent — prevents camera diving into hills

  const back=d.falling?22:13, rise=d.falling?10:6, ahead=d.falling?5:14;
  _vb.copy(playerCar.position).addScaledVector(_va,-back).add(new THREE.Vector3(0,rise,0));
  const lk=playerCar.position.clone().addScaledVector(_va,ahead).add(new THREE.Vector3(0,1,0));

  const sp=d.falling?3:9;
  camPos.lerp(_vb,  Math.min(dt*sp,1));
  camLook.lerp(lk,  Math.min(dt*sp*1.3,1));
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  camera.up.set(0,1,0);
}

// ── LOOP ─────────────────────────────────────────────────────────────────────
function loop(){
  const dt=Math.min(clock.getDelta(),.05);
  const el=clock.getElapsedTime();

  if(gameState==='menu'){
    camera.position.set(Math.cos(el*.14)*175,52,Math.sin(el*.14)*175);
    camera.lookAt(0,15,0); camera.up.set(0,1,0);
  }
  if(gameState==='racing'){
    updatePlayer(dt);
    aiCars.forEach(ai=>updateAI(ai,dt));
    updatePar(dt); updateProj(dt); animPUs(dt,el);
    updateCam(dt);
  }
  if(gameState==='countdown'){
    placeOnTrack(playerCar,playerCar.userData.t,0);
    aiCars.forEach(ai=>placeOnTrack(ai,ai.userData.t,ai.userData.lat));
    updateCam(.016);
  }
  if(stars)stars.rotation.y+=dt*.005;
  renderer.render(scene,camera);
}

init();
</script>
