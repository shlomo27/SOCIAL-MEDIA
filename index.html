<body>
<div id="loading"><h1>WILD RIDE</h1><div id="loadBar"><div id="loadFill"></div></div><div id="loadText">INITIALIZING...</div></div>
<div id="menu"><h1>WILD RIDE</h1><div class="sub">THE MOST INSANE RACE ON EARTH</div><button class="btn" id="startBtn">START RACE</button><button id="gyroBtn">🎮 ENABLE GYROSCOPE</button></div>
<div id="hud"><div id="spd">0<span>KM/H</span></div><div id="pos">1<span>PLACE</span></div><div id="lap">LAP 1/3</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SEGS     = 300;
const ROAD_W   = 16;   // road half-width (world units)
const CAR_H    = 1.6;  // car hover height above road surface
const LAPS     = 3;

// ─── STATE ───────────────────────────────────────────────────────────────────
let renderer, scene, camera, clock;
let curve;                       // CatmullRomCurve3
let roadNormals = [];            // flat (world-up) binormals per segment
let playerCar, aiCars=[];
let powerups=[], particles=[], projectiles=[];
let gameState='loading';
let keys={}, tilt=0, gyroEnabled=false;
let touchLeft=false, touchRight=false;
let raceStart=0, lapTimes=[], currentLap=1;
let playerPU=null, shieldOn=false, magnetOn=false, magnetT=0;
let msgTO, engineSfx=null, audioCtx;
let stars, respawnT=0, shieldMesh=null;
const camPos=new THREE.Vector3(), camLook=new THREE.Vector3();
const UP=new THREE.Vector3(0,1,0);
const _v=new THREE.Vector3(), _v2=new THREE.Vector3();

const W=()=>window.innerWidth, H=()=>window.innerHeight;

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
function setLoad(p,t){$('loadFill').style.width=p+'%';$('loadText').textContent=t;}
function wait(ms=60){return new Promise(r=>setTimeout(r,ms));}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  setLoad(10,'BUILDING RENDERER...'); setupRenderer();
  setLoad(22,'GENERATING TRACK...'); await wait();
  buildTrack();
  setLoad(48,'SPAWNING CARS...'); await wait();
  buildCars();
  setLoad(62,'POWER-UPS...'); await wait();
  spawnPUs();
  setLoad(78,'ATMOSPHERE...'); await wait();
  buildStars(); buildCity(); buildLights();
  setLoad(95,'READY...'); await wait();
  setupControls();
  setLoad(100,'GO!'); await wait(400);
  $('loading').style.display='none';
  $('menu').style.display='flex';
  gameState='menu';
  renderer.setAnimationLoop(loop);
}

// ─── RENDERER ────────────────────────────────────────────────────────────────
function setupRenderer(){
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(W(),H());
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.25;
  document.body.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x000816,0.0035);
  camera=new THREE.PerspectiveCamera(60,W()/H(),0.1,2000);
  camera.up.copy(UP);
  clock=new THREE.Clock();
  window.addEventListener('resize',()=>{renderer.setSize(W(),H());camera.aspect=W()/H();camera.updateProjectionMatrix();});
}

// ─── TRACK ───────────────────────────────────────────────────────────────────
// KEY INSIGHT: we build road with FLAT binormals (cross(tangent, worldUp))
// so the road surface always faces UP. No more sideways-roads.
function buildTrack(){
  const cp=genCP();
  curve=new THREE.CatmullRomCurve3(cp,true,'catmullrom',0.5);

  // Pre-compute flat binormals for every segment
  roadNormals=[];
  for(let i=0;i<=SEGS;i++){
    const t=i/SEGS;
    const tan=curve.getTangent(t).normalize();
    const bi=new THREE.Vector3().crossVectors(tan,UP).normalize();
    roadNormals.push(bi);
  }

  buildRoadMesh();
  buildRails();
  buildRoadMarks();
  buildTrackLights();
}

function genCP(){
  // Curvy but FLAT circuit — Y changes gently (max ±20 units)
  const pts=[], N=28;
  const yList=[0,5,10,14,10,6,2,0,-3,0,5,8,5,2,0,-4,-2,0,4,8,12,8,4,0,-3,0,3,0];
  for(let i=0;i<N;i++){
    const t=i/N, a=t*Math.PI*2;
    const rx=105+Math.sin(t*Math.PI*3)*45;
    const rz=85 +Math.cos(t*Math.PI*2)*35;
    const y=yList[i]||0;
    pts.push(new THREE.Vector3(Math.cos(a)*rx, y, Math.sin(a)*rz));
  }
  return pts;
}

function getRoadBi(t){
  const i=Math.min(Math.floor(((t%1)+1)%1*SEGS),SEGS-1);
  return roadNormals[i];
}

function buildRoadMesh(){
  const pos=[], idx=[], uv=[];
  for(let i=0;i<=SEGS;i++){
    const t=i/SEGS, p=curve.getPoint(t), bi=roadNormals[i];
    const L=p.clone().addScaledVector(bi,-ROAD_W);
    const R=p.clone().addScaledVector(bi, ROAD_W);
    pos.push(L.x,L.y,L.z, R.x,R.y,R.z);
    uv.push(0,t*50, 1,t*50);
  }
  for(let i=0;i<SEGS;i++){
    const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3;
    idx.push(a,b,c,b,d,c);
  }
  idx.push(SEGS*2,SEGS*2+1,0,SEGS*2+1,1,0);

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  geo.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(uv),2));
  geo.setIndex(idx); geo.computeVertexNormals();

  const mat=new THREE.MeshStandardMaterial({color:0x181830,roughness:0.4,metalness:0.5,emissive:0x060620});
  const mesh=new THREE.Mesh(geo,mat); mesh.receiveShadow=true;
  scene.add(mesh);
}

function buildRails(){
  [-ROAD_W, ROAD_W].forEach((side,si)=>{
    const col=si===0?0xff00ff:0x00ffff;
    const topPts=[], botPts=[];
    for(let i=0;i<=SEGS;i++){
      const t=i/SEGS, p=curve.getPoint(t), bi=roadNormals[i];
      const base=p.clone().addScaledVector(bi,side);
      botPts.push(base.clone());
      topPts.push(base.clone().add(new THREE.Vector3(0,2.5,0)));
    }
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(topPts),
      new THREE.LineBasicMaterial({color:col})));
    // Glowing posts every 10 segs
    for(let i=0;i<SEGS;i+=10){
      const t=i/SEGS, p=curve.getPoint(t), bi=roadNormals[i];
      const base=p.clone().addScaledVector(bi,side);
      const post=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,2.5,6),
        new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:1.5}));
      post.position.copy(base).add(new THREE.Vector3(0,1.25,0));
      scene.add(post);
      const pl=new THREE.PointLight(col,3,18); pl.position.copy(post.position); scene.add(pl);
    }
  });
}

function buildRoadMarks(){
  // Dashed center line
  const pts=[];
  for(let i=0;i<=SEGS;i++){
    if(Math.floor(i/5)%2===0) pts.push(curve.getPoint(i/SEGS).clone().add(new THREE.Vector3(0,.05,0)));
  }
  if(pts.length) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.3})));
  // Edge stripes (yellow)
  [-ROAD_W+1.5, ROAD_W-1.5].forEach(side=>{
    const lpts=[];
    for(let i=0;i<=SEGS;i++){
      if(Math.floor(i/3)%2===0){
        const t=i/SEGS, p=curve.getPoint(t), bi=roadNormals[i];
        lpts.push(p.clone().addScaledVector(bi,side).add(new THREE.Vector3(0,.05,0)));
      }
    }
    if(lpts.length) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(lpts),
      new THREE.LineBasicMaterial({color:0xffff00,transparent:true,opacity:.5})));
  });
}

function buildTrackLights(){
  for(let i=0;i<20;i++){
    const p=curve.getPoint(i/20);
    const col=[0xff00ff,0x00ffff,0x6600ff,0x00ff88][i%4];
    const l=new THREE.PointLight(col,3.5,130); l.position.copy(p).y+=5; scene.add(l);
  }
}

// ─── CAR PLACEMENT (world-upright) ───────────────────────────────────────────
function placeOnTrack(car, t, lat){
  const p   = curve.getPoint(((t%1)+1)%1);
  const tan = curve.getTangent(((t%1)+1)%1).normalize();
  const bi  = getRoadBi(t);

  // Position: on road + lateral shift + height
  car.position.copy(p)
    .addScaledVector(bi, lat * ROAD_W * 0.72)
    .add(new THREE.Vector3(0, CAR_H, 0));

  // Orientation: forward = -tangent, up = world Y, with gentle tilt
  const fwd = tan.clone().negate();
  const right = new THREE.Vector3().crossVectors(fwd, UP).normalize();
  const carUp = new THREE.Vector3().crossVectors(right, fwd).normalize();

  const m = new THREE.Matrix4().makeBasis(right, carUp, fwd);
  car.quaternion.setFromRotationMatrix(m);

  // Lean slightly into direction of lateral (like a real car banking in turn)
  // Use euler addition so it's frame-independent
  car.rotateZ(lat * -0.12);
}

// ─── CARS ────────────────────────────────────────────────────────────────────
function buildCars(){
  playerCar=makeCar(0xff0066,0x00ffff,true);
  playerCar.userData=mkD(0,true);
  scene.add(playerCar);

  const pal=[[0xff5500,0xffcc00],[0x00cc44,0x0099ff],[0xaa00ff,0xff66ff]];
  pal.forEach((c,i)=>{
    const car=makeCar(c[0],c[1],false);
    car.userData=mkD(0.025+i*0.025,false);
    car.userData.baseSpeed=0.00065+Math.random()*.00025;
    car.userData.maxSpeed =0.0018 +Math.random()*.0003;
    car.userData.aggression=0.25+Math.random()*.55;
    scene.add(car); aiCars.push(car);
  });
}

function mkD(t,isPlayer){
  return{t,speed:0,baseSpeed:0.00075,maxSpeed:0.0020,
    lat:0,lap:1,lapCount:0,boost:0,frozen:0,
    isPlayer,falling:false,fallVel:new THREE.Vector3()};
}

function makeCar(bodyCol, accentCol){
  const g=new THREE.Group();

  // ── body shell ──
  const bMat=new THREE.MeshStandardMaterial({color:bodyCol,metalness:.92,roughness:.1,emissive:bodyCol,emissiveIntensity:.15});

  // Main body — elongated, flat racer
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.8,0.6,5.0),bMat);
  body.position.y=.3; body.castShadow=true; g.add(body);

  // Hood — slightly raised front
  const hood=new THREE.Mesh(new THREE.BoxGeometry(2.5,.22,1.8),bMat);
  hood.position.set(0,.62,1.1); g.add(hood);

  // Cabin (cockpit)
  const cMat=new THREE.MeshStandardMaterial({color:bodyCol,metalness:.9,roughness:.1,emissive:bodyCol,emissiveIntensity:.1});
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.2,.65,2.0),cMat);
  cabin.position.set(0,.9,-.2); cabin.castShadow=true; g.add(cabin);

  // Windscreen
  const wMat=new THREE.MeshStandardMaterial({color:0x112233,metalness:1,roughness:0,transparent:true,opacity:.65});
  const wind=new THREE.Mesh(new THREE.BoxGeometry(2.0,.5,.12),wMat);
  wind.position.set(0,.94,.78); wind.rotation.x=-.3; g.add(wind);

  // Rear wing
  const wgMat=new THREE.MeshStandardMaterial({color:accentCol,emissive:accentCol,emissiveIntensity:1.5});
  const wing=new THREE.Mesh(new THREE.BoxGeometry(3.1,.1,.7),wgMat);
  wing.position.set(0,1.1,-2.2); g.add(wing);
  [-1.25,1.25].forEach(x=>{
    const sup=new THREE.Mesh(new THREE.BoxGeometry(.1,.5,.1),wgMat);
    sup.position.set(x,.85,-2.2); g.add(sup);
  });

  // Side skirts
  const skMat=new THREE.MeshStandardMaterial({color:accentCol,emissive:accentCol,emissiveIntensity:.8});
  [-1.42,1.42].forEach(x=>{
    const sk=new THREE.Mesh(new THREE.BoxGeometry(.12,.2,4.8),skMat);
    sk.position.set(x,.1,0); g.add(sk);
  });

  // Front bumper / splitter
  const spMat=new THREE.MeshStandardMaterial({color:0x111111,metalness:.6,roughness:.4});
  const spl=new THREE.Mesh(new THREE.BoxGeometry(3.0,.18,.5),spMat);
  spl.position.set(0,.05,2.65); g.add(spl);

  // ── HEADLIGHTS ──
  const hlMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:5});
  [[-1,.38,2.55],[1,.38,2.55],[-.4,.38,2.55],[.4,.38,2.55]].forEach(([x,y,z])=>{
    const hl=new THREE.Mesh(new THREE.BoxGeometry(.55,.18,.08),hlMat);
    hl.position.set(x,y,z); g.add(hl);
  });
  const hfl=new THREE.PointLight(0xffffff,2.5,22); hfl.position.set(0,.4,3.2); g.add(hfl);
  const hfl2=new THREE.SpotLight(0xffffff,4,50,.35); hfl2.position.set(0,.8,2.8); hfl2.target.position.set(0,0,20); g.add(hfl2); g.add(hfl2.target);

  // ── TAILLIGHTS ──
  const tlMat=new THREE.MeshStandardMaterial({color:accentCol,emissive:accentCol,emissiveIntensity:4});
  [[-1,.38,-2.55],[1,.38,-2.55],[-.45,.38,-2.55],[.45,.38,-2.55]].forEach(([x,y,z])=>{
    const tl=new THREE.Mesh(new THREE.BoxGeometry(.45,.14,.08),tlMat);
    tl.position.set(x,y,z); g.add(tl);
  });
  const trl=new THREE.PointLight(accentCol,2,16); trl.position.set(0,.4,-3); g.add(trl);

  // ── EXHAUSTS ──
  const exGeo=new THREE.CylinderGeometry(.12,.12,.6,8);
  const exMat=new THREE.MeshStandardMaterial({color:0x555555,metalness:.9,roughness:.2});
  [-.65,.65].forEach(x=>{
    const ex=new THREE.Mesh(exGeo,exMat); ex.rotation.x=Math.PI/2; ex.position.set(x,.05,-2.85); g.add(ex);
    const eg=new THREE.PointLight(accentCol,2,8); eg.position.set(x,.05,-3.1); g.add(eg);
  });

  // ── WHEELS ──
  const tyreMat=new THREE.MeshStandardMaterial({color:0x111111,metalness:.15,roughness:.95});
  const rimMat =new THREE.MeshStandardMaterial({color:0xdddddd,metalness:1,roughness:.05});
  const hubMat =new THREE.MeshStandardMaterial({color:accentCol,emissive:accentCol,emissiveIntensity:.6,metalness:.5});
  const wheelPos=[[-1.5,-.05,1.65],[1.5,-.05,1.65],[-1.5,-.05,-1.65],[1.5,-.05,-1.65]];
  wheelPos.forEach(([x,y,z])=>{
    const grp=new THREE.Group(); grp.position.set(x,y,z);
    // Tyre
    const tyre=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.42,20),tyreMat);
    tyre.rotation.z=Math.PI/2; grp.add(tyre);
    // Rim
    const rim=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.44,8),rimMat);
    rim.rotation.z=Math.PI/2; grp.add(rim);
    // Hub cap
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.46,6),hubMat);
    hub.rotation.z=Math.PI/2; grp.add(hub);
    g.add(grp);
  });
  // Store wheel groups for spin
  g.userData.wheels=wheelPos.map((_,i)=>g.children[g.children.length-4+i]);

  // Under-glow
  const ug=new THREE.PointLight(accentCol,1.8,14); ug.position.set(0,-.5,0); g.add(ug);

  g.userData.accentCol=accentCol;
  return g;
}

// ─── POWERUPS ────────────────────────────────────────────────────────────────
const PU=[
  {id:'turbo',    emoji:'💨',color:0x00ffff,name:'TURBO BOOST'},
  {id:'rocket',   emoji:'🔫',color:0xff4400,name:'ROCKET'},
  {id:'shield',   emoji:'🛡',color:0x4488ff,name:'SHIELD'},
  {id:'magnet',   emoji:'🧲',color:0xff8800,name:'MAGNET'},
  {id:'bomb',     emoji:'💣',color:0x888888,name:'BOMB'},
  {id:'ice',      emoji:'❄',color:0x88ddff,name:'ICE'},
  {id:'lightning',emoji:'⚡',color:0xffff00,name:'LIGHTNING'},
];

function spawnPUs(){
  for(let i=0;i<18;i++){
    const t=(i/18)+.03;
    const tp=PU[i%PU.length];
    const p=curve.getPoint(((t%1)+1)%1);
    const bi=getRoadBi(t);
    // Place on road surface, slightly elevated
    const pos=p.clone().addScaledVector(bi,(i%3-1)*4.5).add(new THREE.Vector3(0,3,0));

    const grp=new THREE.Group();
    // Outer ring
    grp.add(new THREE.Mesh(new THREE.TorusGeometry(1.1,.25,8,24),
      new THREE.MeshStandardMaterial({color:tp.color,emissive:tp.color,emissiveIntensity:1.8})));
    // Inner sphere
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(.55,10,10),
      new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:3})));
    grp.add(new THREE.PointLight(tp.color,5,22));
    grp.position.copy(pos);
    grp.userData={t,type:tp,collected:false,bob:Math.random()*Math.PI*2};
    scene.add(grp); powerups.push(grp);
  }
}

// ─── ENVIRONMENT ─────────────────────────────────────────────────────────────
function buildStars(){
  const N=2000,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=500+Math.random()*300;
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
    const c=new THREE.Color().setHSL(Math.random(),.6,.7+Math.random()*.3);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  stars=new THREE.Points(geo,new THREE.PointsMaterial({size:1.5,vertexColors:true}));
  scene.add(stars);
}

function buildCity(){
  const bMat=new THREE.MeshStandardMaterial({color:0x060620,roughness:1});
  const gCols=[0xff00ff,0x00ffff,0x8800ff,0x00ff88];
  for(let i=0;i<35;i++){
    const a=Math.random()*Math.PI*2, r=240+Math.random()*100;
    const h=35+Math.random()*110, w=8+Math.random()*16;
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),bMat);
    b.position.set(Math.cos(a)*r,h/2-30,Math.sin(a)*r); scene.add(b);
    // Neon strips
    for(let s=0;s<3;s++){
      const gc=gCols[(i+s)%4];
      const strip=new THREE.Mesh(new THREE.BoxGeometry(w+.3,.8,w+.3),
        new THREE.MeshStandardMaterial({color:gc,emissive:gc,emissiveIntensity:2}));
      strip.position.set(Math.cos(a)*r,h*.2+s*h*.25-30,Math.sin(a)*r); scene.add(strip);
    }
  }
}

function buildLights(){
  scene.add(new THREE.AmbientLight(0x334466,1.6));
  const sun=new THREE.DirectionalLight(0xaabbff,2);
  sun.position.set(60,200,80); sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.far=500;
  scene.add(sun);
  // Rim light from below (neon glow on cars)
  const fill=new THREE.DirectionalLight(0xff00ff,.5);
  fill.position.set(-60,-40,-80); scene.add(fill);
  const fill2=new THREE.DirectionalLight(0x00ffff,.4);
  fill2.position.set(60,-40,80); scene.add(fill2);
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────
function setupControls(){
  document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();usePU();}});
  document.addEventListener('keyup',e=>keys[e.code]=false);
  const on=(el,evts,fn)=>evts.forEach(ev=>el.addEventListener(ev,fn,{passive:false}));
  const L=$('lb'),R=$('rb'),P=$('pub');
  on(L,['touchstart','mousedown'],e=>{e.preventDefault();touchLeft=true;L.classList.add('pr');});
  on(R,['touchstart','mousedown'],e=>{e.preventDefault();touchRight=true;R.classList.add('pr');});
  on(P,['touchstart','mousedown'],e=>{e.preventDefault();usePU();});
  on(L,['touchend','mouseup','touchcancel'],e=>{e.preventDefault();touchLeft=false;L.classList.remove('pr');});
  on(R,['touchend','mouseup','touchcancel'],e=>{e.preventDefault();touchRight=false;R.classList.remove('pr');});
  $('gyroBtn').addEventListener('click',reqGyro);
  $('startBtn').addEventListener('click',startRace);
}

function reqGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')
    DeviceOrientationEvent.requestPermission().then(p=>{if(p==='granted')enableGyro();});
  else enableGyro();
}
function enableGyro(){
  gyroEnabled=true;
  window.addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=Math.max(-1,Math.min(1,e.gamma/28));});
  const b=$('gyroBtn'); b.textContent='✅ GYROSCOPE ACTIVE'; b.style.borderColor='#00ff88'; b.style.color='#00ff88';
}

// ─── AUDIO ───────────────────────────────────────────────────────────────────
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function tone(freq,type,dur,vol=.3,dly=0){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);o.type=type;o.frequency.value=freq;
  const t=audioCtx.currentTime+dly;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t);o.stop(t+dur);
}
const sBoost=()=>{ensureAudio();tone(220,'sawtooth',.3,.5);tone(440,'square',.2,.3,.1);};
const sCollect=()=>{ensureAudio();tone(880,'sine',.2,.4);tone(1200,'sine',.15,.3,.1);};
const sHit=()=>{ensureAudio();tone(80,'sawtooth',.4,.6);};
const sBoom=()=>{ensureAudio();tone(60,'square',.5,.8);tone(120,'sawtooth',.3,.3,.1);};
const sCD=n=>{ensureAudio();tone(n===0?880:440,'square',.3,.6);};

function startEngine(){
  if(engineSfx||!audioCtx)return;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.025;
  const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
  const f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=90;f.Q.value=2;
  const gn=audioCtx.createGain();gn.gain.value=.12;
  src.connect(f);f.connect(gn);gn.connect(audioCtx.destination);src.start();
  engineSfx={src,f,gn};
}

// ─── RACE ────────────────────────────────────────────────────────────────────
function startRace(){
  ensureAudio();
  $('menu').style.display='none'; $('hud').style.display='flex';
  $('puhud').style.display='block'; $('tc').style.display='flex';
  gameState='countdown';

  const pd=playerCar.userData;
  Object.assign(pd,{t:0,speed:0,lat:0,lap:1,lapCount:0,boost:0,frozen:0,falling:false});
  playerPU=null;shieldOn=false;magnetOn=false;currentLap=1;lapTimes=[];

  aiCars.forEach((c,i)=>{
    Object.assign(c.userData,{t:.022+i*.022,speed:0,lap:1,lapCount:0,boost:0,frozen:0,falling:false});
    c.userData.lat=(i%2===0?-.2:.2);
  });
  powerups.forEach(p=>{p.userData.collected=false;p.visible=true;});
  placeOnTrack(playerCar,0,0);
  aiCars.forEach((c,i)=>placeOnTrack(c,.022+i*.022,c.userData.lat));

  // Init camera behind starting position
  const tan=curve.getTangent(0).normalize();
  camPos.copy(playerCar.position).addScaledVector(tan,-14).add(new THREE.Vector3(0,7,0));
  camLook.copy(playerCar.position).addScaledVector(tan,12);

  countdown();
}

function countdown(){
  const el=$('cdt'); let n=3;
  const step=()=>{
    el.style.opacity=1;el.style.transform='scale(1)';
    el.textContent=n===0?'GO!':String(n); el.style.color=n===0?'#00ff88':'#fff';
    sCD(n);
    setTimeout(()=>{el.style.opacity=0;el.style.transform='scale(2)';},600);
    n--; if(n>=0)setTimeout(step,1000);
    else setTimeout(()=>{gameState='racing';raceStart=performance.now();startEngine();},1000);
  };
  step();
}

// ─── UPDATE ──────────────────────────────────────────────────────────────────
function updatePlayer(dt){
  const d=playerCar.userData;
  if(d.falling){fall(playerCar,dt);return;}

  let tgt=d.baseSpeed;
  if(d.boost >0){tgt=d.maxSpeed*1.6;d.boost-=dt;}
  else if(d.frozen>0){tgt=d.baseSpeed*.15;d.frozen-=dt;}
  else tgt=d.baseSpeed+(d.maxSpeed-d.baseSpeed)*.9;
  d.speed+=(tgt-d.speed)*Math.min(dt*7,1);
  d.t+=d.speed;
  if(d.t>=1){d.t-=1;finishLap(playerCar);}

  let steer=0;
  if(keys['ArrowLeft'] ||touchLeft )steer-=1;
  if(keys['ArrowRight']||touchRight)steer+=1;
  if(gyroEnabled)steer+=tilt;
  steer=Math.max(-1,Math.min(1,steer));
  d.lat+=steer*dt*2.8; d.lat*=(1-dt*.6); d.lat=Math.max(-1,Math.min(1,d.lat));

  if(Math.abs(d.lat)>=.98){beginFall(playerCar);return;}
  placeOnTrack(playerCar,d.t,d.lat);
  spinWheels(playerCar,d.speed,dt);

  if(d.boost>0)boostFX(playerCar);
  if(magnetOn){magnetT-=dt;if(magnetT<=0)magnetOn=false;else nearPU(playerCar,15);}

  aiCars.forEach(ai=>{if(playerCar.position.distanceTo(ai.position)<5.5)ram(playerCar,ai);});
  powerups.forEach(pu=>{if(!pu.userData.collected&&playerCar.position.distanceTo(pu.position)<6.5)pickPU(playerCar,pu);});

  updateHUD(d);
}

function updateAI(car,dt){
  const d=car.userData;
  if(d.falling){fall(car,dt);return;}
  let tgt=d.baseSpeed;
  if(d.boost >0){tgt=d.maxSpeed*1.4;d.boost-=dt;}
  else if(d.frozen>0){tgt=d.baseSpeed*.15;d.frozen-=dt;}
  else tgt=d.baseSpeed+(d.maxSpeed-d.baseSpeed)*.83;
  d.speed+=(tgt-d.speed)*Math.min(dt*4,1);
  d.t+=d.speed; if(d.t>=1){d.t-=1;d.lap++;d.lapCount++;}
  let steer=-d.lat*.9;
  const ah=((playerCar.userData.t-d.t+1)%1);
  if(ah<.04&&d.aggression>.4)steer+=(playerCar.userData.lat-d.lat)*d.aggression*1.7;
  d.lat+=steer*dt*2; d.lat=Math.max(-.92,Math.min(.92,d.lat));
  if(Math.abs(d.lat)>.9&&Math.random()<.04)beginFall(car);
  placeOnTrack(car,d.t,d.lat);
  spinWheels(car,d.speed,dt);
  powerups.forEach(pu=>{
    if(!pu.userData.collected&&car.position.distanceTo(pu.position)<5.5){
      pu.userData.collected=true;pu.visible=false;if(Math.random()<.35)d.boost=2.5;
    }
  });
}

function spinWheels(car,speed,dt){
  if(!car.userData.wheels)return;
  car.userData.wheels.forEach(wg=>{if(wg)wg.rotation.x+=speed*900*dt;});
}

function beginFall(car){
  const d=car.userData;
  if(d.isPlayer&&shieldOn){shieldOn=false;d.lat=Math.sign(d.lat)*.5;showMsg('SHIELD SAVED YOU!');return;}
  d.falling=true; d.fallVel.set((Math.random()-.5)*7,12,(Math.random()-.5)*7);
  if(d.isPlayer){sHit();showMsg('FELL OFF!');respawnT=0;}
}

function fall(car,dt){
  const d=car.userData;
  d.fallVel.y-=25*dt;
  car.position.addScaledVector(d.fallVel,dt);
  car.rotation.x+=dt*3; car.rotation.z+=dt*2;
  respawnT+=dt;
  if(d.isPlayer){
    if(respawnT>2.5){d.falling=false;d.lat=0;car.rotation.set(0,0,0);placeOnTrack(car,d.t,0);showMsg('RESPAWNED!');}
  }else{
    if(respawnT>1.8){d.falling=false;d.lat=0;car.rotation.set(0,0,0);placeOnTrack(car,d.t,0);}
  }
}

function ram(c1,c2){
  const diff=c1.userData.lat-c2.userData.lat;
  c1.userData.lat+=Math.sign(diff)*.22; c2.userData.lat-=Math.sign(diff)*.22;
  sparkFX(c1.position.clone().lerp(c2.position,.5)); sHit();
}

function finishLap(car){
  const d=car.userData; d.lap++;d.lapCount++;
  if(d.isPlayer){
    currentLap=d.lap; lapTimes.push(performance.now()-raceStart);
    if(d.lap>LAPS){endRace();return;}
    $('lap').textContent=`LAP ${Math.min(d.lap,LAPS)}/${LAPS}`;
    showMsg(`LAP ${d.lap-1} COMPLETE!`);
  }
}

function endRace(){
  gameState='end';
  const ms=lapTimes[lapTimes.length-1]||(performance.now()-raceStart);
  const all=[playerCar,...aiCars].sort((a,b)=>(b.userData.lapCount+b.userData.t)-(a.userData.lapCount+a.userData.t));
  const pos=all.indexOf(playerCar)+1;
  const sfx=['ST','ND','RD','TH'][Math.min(pos-1,3)];
  const titles=['🏆 CHAMPION!','🥈 GREAT RACE!','🥉 PODIUM!','😤 KEEP TRYING!'];
  $('endTitle').textContent=titles[pos-1]||titles[3];
  $('endStats').innerHTML=`<b>POSITION:</b> ${pos}${sfx} PLACE<br><b>TIME:</b> ${(ms/1e3).toFixed(2)}s<br><b>LAPS:</b> ${LAPS}`;
  $('end').style.display='flex'; $('hud').style.display='none'; $('tc').style.display='none';
  if(pos===1){ensureAudio();[0,1,2,3].forEach(i=>setTimeout(()=>tone(440+i*110,'sine',.3,.4),i*200));}
}

// ─── POWERUPS ────────────────────────────────────────────────────────────────
function pickPU(car,pu){
  pu.userData.collected=true;pu.visible=false;sCollect();
  if(car.userData.isPlayer){
    playerPU=pu.userData.type;updatePUhud();showMsg(pu.userData.type.name+'!');
    setTimeout(()=>{if(pu.userData.collected){pu.userData.collected=false;pu.visible=true;}},9e3+Math.random()*4e3);
  }
}
function nearPU(car,r){powerups.forEach(pu=>{if(!pu.userData.collected&&car.position.distanceTo(pu.position)<r)pickPU(car,pu);});}

function usePU(){
  if(!playerPU||gameState!=='racing')return;
  ensureAudio();
  const tp=playerPU;playerPU=null;updatePUhud();
  const d=playerCar.userData;
  switch(tp.id){
    case 'turbo':    d.boost=3;sBoost();showMsg('TURBO!');for(let i=0;i<15;i++)boostFX(playerCar);break;
    case 'rocket':   fireRocket();break;
    case 'shield':   shieldOn=true;showMsg('SHIELD ON!');addShield(playerCar);setTimeout(()=>{shieldOn=false;remShield(playerCar);},8e3);break;
    case 'magnet':   magnetOn=true;magnetT=6;showMsg('MAGNET!');break;
    case 'bomb':     dropBomb();break;
    case 'ice':      freezeNear();break;
    case 'lightning':lightningAll();break;
  }
}

function addShield(car){remShield(car);shieldMesh=new THREE.Mesh(new THREE.SphereGeometry(4.5,14,14),new THREE.MeshStandardMaterial({color:0x4488ff,emissive:0x4488ff,emissiveIntensity:.5,transparent:true,opacity:.28,wireframe:true}));car.add(shieldMesh);}
function remShield(car){if(shieldMesh){car.remove(shieldMesh);shieldMesh=null;}}

function fireRocket(){
  let tgt=null,best=Infinity;
  const pt=playerCar.userData.t;
  aiCars.forEach(ai=>{const ah=((ai.userData.t-pt+1)%1);if(ah<.4&&ah<best){best=ah;tgt=ai;}});
  if(!tgt){showMsg('NO TARGET!');return;}
  const r=mkProj(0xff4400); r.position.copy(playerCar.position);
  r.userData={target:tgt,speed:55,rocket:true};
  scene.add(r);projectiles.push(r);sBoost();showMsg('ROCKET!');
}

function dropBomb(){
  const tan=curve.getTangent(((playerCar.userData.t%1)+1)%1).normalize();
  const b=mkProj(0x888888); b.position.copy(playerCar.position).addScaledVector(tan,-3.5);
  b.userData={bomb:true,timer:2.5}; scene.add(b);projectiles.push(b);showMsg('BOMB!');
}

function freezeNear(){
  let c=null,minD=Infinity;
  aiCars.forEach(ai=>{const d=playerCar.position.distanceTo(ai.position);if(d<minD){minD=d;c=ai;}});
  if(c){c.userData.frozen=2.5;iceFX(c.position);showMsg('FROZEN!');}
}

function lightningAll(){aiCars.forEach(ai=>{ai.userData.frozen=2;iceFX(ai.position);});showMsg('LIGHTNING!');tone(150,'sawtooth',.5,.7);}

function mkProj(col){
  const m=new THREE.Mesh(new THREE.ConeGeometry(.3,1.6,8),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:3}));
  m.add(new THREE.PointLight(col,5,16));return m;
}

function updateProj(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    if(p.userData.rocket){
      const tgt=p.userData.target;
      if(tgt&&!tgt.userData.falling){
        _v.copy(tgt.position).sub(p.position).normalize();
        p.position.addScaledVector(_v,p.userData.speed*dt);p.lookAt(tgt.position);
        if(p.position.distanceTo(tgt.position)<5.5){boomFX(p.position.clone());beginFall(tgt);scene.remove(p);projectiles.splice(i,1);}
      }else{scene.remove(p);projectiles.splice(i,1);}
    }else if(p.userData.bomb){
      p.userData.timer-=dt;p.rotation.y+=dt*4;
      if(p.userData.timer<=0){
        boomFX(p.position.clone());
        aiCars.forEach(ai=>{if(ai.position.distanceTo(p.position)<14)beginFall(ai);});
        scene.remove(p);projectiles.splice(i,1);
      }
    }
  }
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
function mkP(col,sz=.28){return new THREE.Mesh(new THREE.SphereGeometry(sz,4,4),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:2,transparent:true}));}
function addPar(p,vx,vy,vz,life){p.userData={vx,vy,vz,life,max:life};particles.push(p);scene.add(p);}

function boostFX(car){
  const tan=curve.getTangent(((car.userData.t%1)+1)%1).normalize();
  const bi=getRoadBi(car.userData.t);
  for(let i=0;i<2;i++){
    const p=mkP(0x00eeff,.22+Math.random()*.15);
    p.position.copy(car.position).addScaledVector(tan,-2.8).addScaledVector(bi,(Math.random()-.5));
    addPar(p,-tan.x*(5+Math.random()*5),-tan.y*(5+Math.random()*5),-tan.z*(5+Math.random()*5),.32+Math.random()*.2);
  }
}

function sparkFX(pos){
  for(let i=0;i<8;i++){
    const p=mkP(0xffaa00,.18); p.position.copy(pos);
    addPar(p,(Math.random()-.5)*16,Math.random()*10,(Math.random()-.5)*16,.4);
  }
}

function iceFX(pos){
  for(let i=0;i<10;i++){
    const p=mkP(0x88ddff,.3);
    p.position.copy(pos).add(new THREE.Vector3((Math.random()-.5)*3,(Math.random()-.5)*2,(Math.random()-.5)*3));
    addPar(p,(Math.random()-.5)*8,Math.random()*6,(Math.random()-.5)*8,.65);
  }
}

function boomFX(pos){
  sBoom();
  const cols=[0xff4400,0xff8800,0xffff00,0xff0000];
  for(let i=0;i<24;i++){
    const p=mkP(cols[i%4],.45+Math.random()*.35); p.position.copy(pos);
    addPar(p,(Math.random()-.5)*22,Math.random()*16+5,(Math.random()-.5)*22,.8+Math.random()*.5);
  }
}

function updatePar(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.userData.life-=dt;
    if(p.userData.life<=0){scene.remove(p);particles.splice(i,1);continue;}
    p.userData.vy-=14*dt;
    p.position.x+=p.userData.vx*dt; p.position.y+=p.userData.vy*dt; p.position.z+=p.userData.vz*dt;
    p.material.opacity=p.userData.life/p.userData.max;
  }
}

// ─── PU ANIMATION ────────────────────────────────────────────────────────────
function animPUs(dt,t){
  powerups.forEach(pu=>{
    if(pu.userData.collected)return;
    pu.rotation.y+=dt*2.5;pu.rotation.x+=dt*.5;
    pu.position.y+=Math.sin(t*2+pu.userData.bob)*dt*.8;
    if(pu.children[0])pu.children[0].material.emissiveIntensity=1.2+Math.sin(t*3+pu.userData.bob)*.8;
  });
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function updateHUD(d){
  $('spd').innerHTML=`${Math.round(d.speed*265000)}<span>KM/H</span>`;
  const all=[playerCar,...aiCars].sort((a,b)=>(b.userData.lapCount+b.userData.t)-(a.userData.lapCount+a.userData.t));
  const p=all.indexOf(playerCar)+1;
  $('pos').innerHTML=`${p}<span>${['ST','ND','RD','TH'][Math.min(p-1,3)]} PLACE</span>`;
  $('lap').textContent=`LAP ${Math.min(d.lap,LAPS)}/${LAPS}`;
  const ratio=d.speed/d.maxSpeed;
  $('sl').style.opacity=d.boost>0?.9:Math.max(0,(ratio-.5)*2);
  if(engineSfx){engineSfx.f.frequency.value=70+ratio*240;engineSfx.gn.gain.value=.08+ratio*.14;}
}

function updatePUhud(){
  $('puhud').innerHTML=playerPU?`${playerPU.emoji}<span class="pn">${playerPU.name}</span>`:'';
}

function showMsg(text){
  $('msg').textContent=text; $('msg').style.opacity=1;
  clearTimeout(msgTO); msgTO=setTimeout(()=>$('msg').style.opacity=0,1800);
}

// ─── CAMERA — World-upright chase cam ────────────────────────────────────────
// We NEVER use track normal for camera. Camera always uses world Y as up.
// This prevents the sideways-camera problem on banked/looping track.
function updateCam(dt){
  const d=playerCar.userData;
  const tan=curve.getTangent(((d.t%1)+1)%1).normalize();

  // Reduce Y component of tangent so cam doesn't go underground on hills
  _v.set(tan.x,tan.y*.25,tan.z).normalize();

  const back  = d.falling ? 22 : 13;
  const rise  = d.falling ? 10 :  6;
  const ahead = d.falling ?  5 : 14;

  // Camera position: behind car, lifted in world Y
  _v2.copy(playerCar.position)
    .addScaledVector(_v,-back)
    .add(new THREE.Vector3(0,rise,0));

  // Look-at point: ahead of car
  const lookAt=playerCar.position.clone().addScaledVector(_v,ahead).add(new THREE.Vector3(0,1,0));

  const sp=d.falling?3:9;
  camPos.lerp(_v2,   Math.min(dt*sp,1));
  camLook.lerp(lookAt,Math.min(dt*sp*1.3,1));
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  camera.up.set(0,1,0); // always world up
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
function loop(){
  const dt=Math.min(clock.getDelta(),.05);
  const elapsed=clock.getElapsedTime();

  if(gameState==='menu'){
    camera.position.set(Math.cos(elapsed*.15)*180,55,Math.sin(elapsed*.15)*180);
    camera.lookAt(0,15,0); camera.up.set(0,1,0);
  }

  if(gameState==='racing'){
    updatePlayer(dt);
    aiCars.forEach(ai=>updateAI(ai,dt));
    updatePar(dt); updateProj(dt); animPUs(dt,elapsed);
    updateCam(dt);
  }

  if(gameState==='countdown'){
    placeOnTrack(playerCar,playerCar.userData.t,0);
    aiCars.forEach(ai=>placeOnTrack(ai,ai.userData.t,ai.userData.lat));
    updateCam(.016);
  }

  if(stars)stars.rotation.y+=dt*.006;
  renderer.render(scene,camera);
}

init();
</script>
